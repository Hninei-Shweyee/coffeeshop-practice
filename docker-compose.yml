services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hesy123
      MYSQL_DATABASE: coffeeshopproject
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql


  coffeepj:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: hesy123
      DB_NAME: coffeeshopproject
    networks:
      - mynetwork
    volumes:
      - .:/app

networks:
  mynetwork:

volumes:
  mysql_data:
